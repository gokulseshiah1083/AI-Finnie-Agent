llm:
  model: "claude-sonnet-4-6"
  max_tokens: 4096
  temperature: 0.3

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  faiss_index_path: "src/data/faiss_index"
  knowledge_base_path: "src/data/knowledge_base"

market_data:
  cache_ttl_minutes: 30
  default_symbols: ["SPY", "QQQ", "BND", "GLD", "VTI"]
  alpha_vantage_base_url: "https://www.alphavantage.co/query"
  alpha_vantage_timeout: 10
  news_limit: 10

agents:
  max_iterations: 3
  fallback_message: "I apologize, but I'm unable to process your request at the moment. Please try again or rephrase your question."

streamlit:
  page_title: "AI Finance Assistant"
  page_icon: "💰"
  layout: "wide"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
